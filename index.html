<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tank Battle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <header id="hud">
      <div class="hud-item">Score <span id="score">0</span></div>
      <div class="hud-item">Level <span id="level">1</span></div>
      <div class="hud-item">Lives <span id="lives">3</span></div>
      <div class="hud-bar">
        <div id="health-fill"></div>
      </div>
    </header>

    <canvas id="game" width="900" height="600"></canvas>

    <div id="overlay" class="overlay">
      <div class="panel">
        <h1>TANK BATTLE</h1>
        <p class="tagline">Destroy every enemy tank to clear the level.</p>
        <ul class="controls">
          <li><b>W A S D</b> — Move</li>
          <li><b>Mouse</b> — Aim turret</li>
          <li><b>Left Click / Space</b> — Fire</li>
          <li><b>P</b> — Pause</li>
        </ul>
        <button id="start-btn">Start Game</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
